name: Publish doctor website

on:
  push:
    branches: [main]
    paths:
      - 'dr-anudeep-v2/**'
      - '.pages.yml'
      - '.github/workflows/publish-doctor-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doctor-site-pages
  cancel-in-progress: false

jobs:
  build:
    # Enable explicitly when choosing GitHub Pages rather than Cloudflare.
    if: vars.SITE_HOST == 'github-pages' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: dr-anudeep-v2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dr-anudeep-v2/package-lock.json
      - name: Read GitHub Pages URL
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - name: Build published articles only
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_PATH_PREFIX: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dr-anudeep-v2/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish built site
        id: deployment
        uses: actions/deploy-pages@v5
